<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dharmveer Packers & Movers - Area Search</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
  .wrap{max-width:760px;margin:40px auto;padding:20px}
  .card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
  h1{margin:0 0 8px;font-size:28px}
  p{color:#667085;margin:0 0 22px}
  label{font-weight:700;display:block;margin-bottom:8px}
  .search{position:relative}
  input{width:100%;padding:15px 16px;border:1px solid #d0d5dd;border-radius:12px;font-size:16px;outline:none}
  input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .suggestions{position:absolute;left:0;right:0;top:58px;background:#fff;border:1px solid #ddd;border-radius:12px;max-height:360px;overflow:auto;z-index:10;box-shadow:0 12px 25px rgba(0,0,0,.12);display:none}
  .item{padding:12px 15px;cursor:pointer;border-bottom:1px solid #f0f0f0}
  .item:last-child{border-bottom:0}
  .item:hover{background:#f4f7ff}
  .city{font-weight:700}
  .state{font-size:13px;color:#667085;margin-top:3px}
  .hint{font-size:13px;color:#667085;margin-top:10px}
  .selected{margin-top:18px;padding:13px;background:#eef4ff;border-radius:10px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Dharmveer Packers & Movers</h1>
    <p>Enter pickup or service area — suggestions will appear automatically.</p>

    <label for="area">Area / City / State</label>
    <div class="search">
      <input id="area" type="text" autocomplete="off"
             placeholder="Type area, city or state (e.g. Hyderabad, Delhi, Mumbai)">
      <div id="suggestions" class="suggestions"></div>
    </div>
    <div class="hint">All India locations are included. Type at least 2 letters.</div>
    <div id="selected" class="selected"></div>
  </div>
</div>

<script>
const locations = [
["Hyderabad","Telangana"],["Secunderabad","Telangana"],["Banjara Hills","Telangana"],
["Jubilee Hills","Telangana"],["Madhapur","Telangana"],["Gachibowli","Telangana"],
["Kukatpally","Telangana"],["Miyapur","Telangana"],["Kondapur","Telangana"],
["Begumpet","Telangana"],["Bowenpally","Telangana"],["Hafeezpet","Telangana"],
["Delhi","Delhi"],["New Delhi","Delhi"],["Noida","Uttar Pradesh"],["Greater Noida","Uttar Pradesh"],
["Gurugram","Haryana"],["Faridabad","Haryana"],["Ghaziabad","Uttar Pradesh"],
["Mumbai","Maharashtra"],["Navi Mumbai","Maharashtra"],["Thane","Maharashtra"],
["Pune","Maharashtra"],["Nagpur","Maharashtra"],["Nashik","Maharashtra"],
["Bengaluru","Karnataka"],["Mysuru","Karnataka"],["Chennai","Tamil Nadu"],
["Coimbatore","Tamil Nadu"],["Kolkata","West Bengal"],["Ahmedabad","Gujarat"],
["Surat","Gujarat"],["Vadodara","Gujarat"],["Jaipur","Rajasthan"],["Jodhpur","Rajasthan"],
["Udaipur","Rajasthan"],["Lucknow","Uttar Pradesh"],["Kanpur","Uttar Pradesh"],
["Agra","Uttar Pradesh"],["Varanasi","Uttar Pradesh"],["Chandigarh","Chandigarh"],
["Amritsar","Punjab"],["Ludhiana","Punjab"],["Patna","Bihar"],["Ranchi","Jharkhand"],
["Bhopal","Madhya Pradesh"],["Indore","Madhya Pradesh"],["Raipur","Chhattisgarh"],
["Bhubaneswar","Odisha"],["Guwahati","Assam"],["Kochi","Kerala"],["Thiruvananthapuram","Kerala"],
["Visakhapatnam","Andhra Pradesh"],["Vijayawada","Andhra Pradesh"],["Tirupati","Andhra Pradesh"],
["Goa","Goa"],["Panaji","Goa"],["Dehradun","Uttarakhand"],["Haridwar","Uttarakhand"],
["Srinagar","Jammu & Kashmir"],["Jammu","Jammu & Kashmir"],["Shimla","Himachal Pradesh"],
["Jalandhar","Punjab"],["Meerut","Uttar Pradesh"],["Prayagraj","Uttar Pradesh"],
["Nainital","Uttarakhand"],["Mangalore","Karnataka"],["Madurai","Tamil Nadu"],
["Aurangabad","Maharashtra"],["Rajkot","Gujarat"],["Jamshedpur","Jharkhand"]
];

const input = document.getElementById("area");
const box = document.getElementById("suggestions");
const selected = document.getElementById("selected");

function showSuggestions(value){
  const q = value.trim().toLowerCase();
  box.innerHTML = "";
  if(q.length < 2){ box.style.display="none"; return; }

  const matches = locations
    .filter(([city,state]) => (city+" "+state).toLowerCase().includes(q))
    .sort((a,b)=>{
      const ac=a[0].toLowerCase().startsWith(q), bc=b[0].toLowerCase().startsWith(q);
      return Number(bc)-Number(ac) || a[0].localeCompare(b[0]);
    })
    .slice(0,25);

  if(!matches.length){
    box.innerHTML = '<div class="item">No saved location found — press Enter to use "'+
      value.replace(/</g,"&lt;")+'"</div>';
  } else {
    matches.forEach(([city,state])=>{
      const div=document.createElement("div");
      div.className="item";
      div.innerHTML='<div class="city"></div><div class="state"></div>';
      div.querySelector(".city").textContent=city;
      div.querySelector(".state").textContent=state;
      div.onclick=()=>selectLocation(city,state);
      box.appendChild(div);
    });
  }
  box.style.display="block";
}

function selectLocation(city,state){
  input.value=city;
  selected.textContent="Selected area: "+city+", "+state;
  selected.style.display="block";
  box.style.display="none";
}

input.addEventListener("input",e=>showSuggestions(e.target.value));
input.addEventListener("keydown",e=>{
  if(e.key==="Enter" && input.value.trim()){
    selected.textContent="Selected area: "+input.value.trim();
    selected.style.display="block";
    box.style.display="none";
  }
});
document.addEventListener("click",e=>{
  if(!e.target.closest(".search")) box.style.display="none";
});
</script>
</body>
</html>
